include:
  # Kept from the GitLab project setup: scan commits for leaked secrets.
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build
  - secret-detection

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true

test:
  stage: test
  image: node:22.18.0-bookworm-slim
  timeout: 15m
  services:
    - name: postgis/postgis:16-3.5
      alias: db
  variables:
    POSTGRES_DB: gis_test
    POSTGRES_USER: gis_test
    POSTGRES_PASSWORD: ci-only-ephemeral
    DATABASE_URL: postgresql://gis_test:ci-only-ephemeral@db:5432/gis_test
    NODE_ENV: test
    PORT: "3001"
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --ignore-scripts
    - npm run test:unit
    - npm run test:integration
    - npm run test:import:unit
    - npm run test:import:integration

image:
  stage: build
  image: docker:27.5.1
  timeout: 20m
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: [test]
  script:
    - docker build --pull -t gis-api:$CI_COMMIT_SHORT_SHA .

secret_detection:
  stage: secret-detection
