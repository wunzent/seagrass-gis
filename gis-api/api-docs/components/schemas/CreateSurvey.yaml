type: object
properties:
  lon:
    type: number
    minimum: -180
    maximum: 180
    example: 99.35
  lat:
    type: number
    minimum: -90
    maximum: 90
    example: 7.38
  surveyed_on:
    type: string
    format: date
    example: '2026-10-01'
    description: วันที่จริง ไม่เกินวันนี้ตามเวลา Asia/Bangkok
  cover_percent:
    type: number
    minimum: 0
    maximum: 100
    example: 45.5
  species:
    minItems: 1
    maxItems: 50
    uniqueItems: true
    example:
      - EA
      - HO
    description: รหัสชนิดจาก GET /species ไม่ซ้ำกัน
    type: array
    items:
      type: string
  note:
    type: string
    nullable: true
    maxLength: 2000
    example: น้ำขุ่น
required:
  - lon
  - lat
  - surveyed_on
  - cover_percent
  - species
