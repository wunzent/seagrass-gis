get:
  operationId: SitesController_list
  parameters:
    - name: province
      required: false
      in: query
      schema:
        pattern: ^[0-9A-Za-z]{1,2}$
        example: '81'
        type: string
    - name: status
      required: false
      in: query
      schema:
        type: string
        enum:
          - very_good
          - good
          - fair
          - poor
          - no_data
    - name: q
      required: false
      in: query
      description: ค้นหา code/name แบบ literal substring ไม่สนตัวพิมพ์
      schema:
        maxLength: 100
        type: string
    - name: page
      required: false
      in: query
      schema:
        minimum: 1
        default: 1
        type: integer
    - name: pageSize
      required: false
      in: query
      schema:
        minimum: 1
        maximum: 100
        default: 20
        type: integer
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SitesPage.yaml
    '400':
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: VALIDATION_ERROR
              message: ...
              details: {}
    '503':
      description: SERVICE_UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: ...
              details: {}
  summary: รายการแหล่งหญ้าทะเลที่ใช้งาน (ไม่มี geometry) เรียง code
  tags:
    - sites
