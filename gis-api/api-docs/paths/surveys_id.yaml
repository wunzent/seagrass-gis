patch:
  operationId: SurveysController_update
  parameters:
    - name: id
      required: true
      in: path
      schema:
        minimum: 1
        example: 1
        type: integer
    - name: X-CSRF-Protection
      in: header
      description: ต้องส่งเมื่อใช้ cookie; Bearer ไม่ต้องส่ง
      required: false
      schema:
        type: string
        enum:
          - '1'
    - name: Origin
      in: header
      description: ต้องตรงกับ PUBLIC_WEB_ORIGIN หรือ API_DOCS_ORIGIN; ต้องส่งเมื่อใช้ cookie; Bearer ไม่ต้องส่ง
      required: false
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateSurvey.yaml
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreatedSurvey.yaml
    '400':
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: VALIDATION_ERROR
              message: ...
              details: {}
    '401':
      description: UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: UNAUTHORIZED
              message: ...
              details: {}
    '403':
      description: FORBIDDEN | CSRF_REJECTED
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: FORBIDDEN
              message: ...
              details: {}
    '404':
      description: SURVEY_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: SURVEY_NOT_FOUND
              message: ...
              details: {}
    '422':
      description: OUTSIDE_SITE
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: OUTSIDE_SITE
              message: ...
              details: {}
    '503':
      description: SERVICE_UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: ...
              details: {}
  security:
    - bearer: []
    - gis_access: []
  summary: แก้ไขการสำรวจบางส่วน (editor/admin); ตรวจ record หลัง merge รวมระยะ 50 m
  tags:
    - surveys
