post:
  operationId: AuthController_login
  parameters:
    - name: X-CSRF-Protection
      in: header
      description: ต้องส่งเสมอ
      required: true
      schema:
        type: string
        enum:
          - '1'
    - name: Origin
      in: header
      description: ต้องตรงกับ PUBLIC_WEB_ORIGIN หรือ API_DOCS_ORIGIN
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginDto.yaml
  responses:
    '200':
      headers:
        Set-Cookie:
          schema:
            type: string
          description: gis_access=<JWT>; Max-Age=900; Path=/; HttpOnly; SameSite=Lax
      description: ''
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LoginResponse.yaml
    '400':
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: VALIDATION_ERROR
              message: ...
              details: {}
    '401':
      description: INVALID_CREDENTIALS
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: INVALID_CREDENTIALS
              message: ...
              details: {}
    '403':
      description: CSRF_REJECTED
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: CSRF_REJECTED
              message: ...
              details: {}
    '429':
      description: AUTH_RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: AUTH_RATE_LIMITED
              message: ...
              details: {}
    '503':
      description: SERVICE_UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorBody.yaml
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: ...
              details: {}
  summary: 'เข้าสู่ระบบ: คืน JWT ใน JSON และตั้ง HttpOnly cookie gis_access (JWT 15 นาที)'
  tags:
    - auth
