name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gis-api
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: gis_test
          POSTGRES_USER: gis_test
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis_test -d gis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      db-import:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: gis_import_test
          POSTGRES_USER: gis_test
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gis_test -d gis_import_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://gis_test:ci-only-ephemeral@localhost:5432/gis_test
      IMPORT_TEST_DATABASE_URL: postgresql://gis_test:ci-only-ephemeral@localhost:5433/gis_import_test
      NODE_ENV: test
      PORT: "3001"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: gis-api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:import:unit
      - run: npm run test:import:integration

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gis-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: gis-web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run typecheck

  api-image:
    needs: api-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build --pull ./gis-api

  web-image:
    needs: web-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build --pull ./gis-web
