include:
  # Kept from the GitLab project setup: scan commits for leaked secrets.
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - secret-detection

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

compose:
  stage: validate
  image: docker:27.5.1
  timeout: 5m
  script:
    # Build contexts ../gis-api and ../gis-web live in sibling repositories; only the file syntax is validated here.
    - docker compose config --quiet --no-path-resolution

secret_detection:
  stage: secret-detection
