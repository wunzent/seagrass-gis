name: seagrass-gis

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis-local-demo-only}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./gis-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis-local-demo-only}@db:5432/${POSTGRES_DB:-gis}
      PORT: 3001
      NODE_ENV: production
      TZ: Asia/Bangkok
      SEED_DATA_DIR: /seed-data
      IMPORT_REPORT_DIR: /reports
      # Demo-only auth settings for loopback Docker; override in .env, never reuse outside local assessment.
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-jwt-secret-not-for-production}
      PUBLIC_WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      API_DOCS_ORIGIN: http://localhost:${API_PORT:-3001}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer-demo-only}
      DEMO_EDITOR_PASSWORD: ${DEMO_EDITOR_PASSWORD:-editor-demo-only}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin-demo-only}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ./seed-data
        target: /seed-data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./reports
        target: /reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  web:
    build:
      context: ./gis-web
    environment:
      API_INTERNAL_URL: http://api:3001
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
